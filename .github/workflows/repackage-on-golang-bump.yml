name: repackage-on-golang-bump

# Auto-cut a -mavericks.(N+1) REPACKAGE when the golang toolchain pin (# mavericks-golang) moves,
# so downstream ships rebuilt with the new Go without a human step. A NEW upstream Tailscale is
# release-on-bump.yml's job (cuts <upstream>-mavericks.1); a SAME-upstream toolchain bump is a
# repackage (N+1), handled here. Forward-only + idempotent: no-op if the pin didn't actually change
# in this push, or the target tag already exists.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ci.yml', '.github/workflows/release.yml']  # where GO_PKG_REF lives
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-on-bump      # share with release-on-bump.yml so the two auto-cutters never race
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Cut a repackage if the golang toolchain pin moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          before="${{ github.event.before }}"
          case "$before" in ''|0000000000000000000000000000000000000000) before="HEAD~1";; esac
          # Only act when THIS push actually changed the '# mavericks-golang' pin line.
          if ! git diff "$before" HEAD -- .github/workflows/ci.yml .github/workflows/release.yml \
               | grep -Eq '^[+-].*#[[:space:]]*mavericks-golang'; then
            echo "golang pin unchanged in this push -- no repackage."; exit 0
          fi
          CUR=$(cat VERSION); UP=${CUR%%-mavericks.*}; N=${CUR##*-mavericks.}
          case "$N" in ''|*[!0-9]*) echo "::error::unexpected VERSION '$CUR'"; exit 1;; esac
          NEW="${UP}-mavericks.$((N + 1))"
          if git ls-remote --exit-code --tags origin "$NEW" >/dev/null 2>&1; then
            echo "tag $NEW already exists -- nothing to do."; exit 0
          fi
          echo "repackaging $CUR -> $NEW (golang toolchain bump)"
          printf '%s\n' "$NEW" > VERSION
          NOTES="release-notes/$NEW.md"
          if [ ! -s "$NOTES" ]; then
            {
              echo "ModernMavericks Tailscale $NEW."
              echo
              echo "- Repackage of upstream Tailscale **$UP**, rebuilt with an updated ModernMavericks"
              echo "  go126 toolchain (see the golang release for the Go version). No upstream Tailscale change."
              echo "- Automatically cut from a golang toolchain pin bump."
            } > "$NOTES"
          fi
          git config user.name  modernmavericks-bot
          git config user.email bot@modernmavericks.dev
          git add VERSION "$NOTES"
          git commit -m "release: repackage $NEW (golang toolchain bump)"
          git push origin HEAD:main
          git tag "$NEW"
          git push origin "$NEW"
