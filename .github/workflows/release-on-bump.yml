name: release-on-bump

# When the tailscale source pin (components/tailscale/version) moves, ask release.yml to consider a
# NEW upstream release. This workflow is deliberately thin: release.yml owns the whole decision --
# read the pinned source's VERSION.txt, compare it forward-only against the newest shipped tag, and
# if it moved ahead, cut and publish <upstream>-mavericks.1 inline. Keeping that logic in one place
# is what stops the two auto-cutters from disagreeing about what is shipped.
#
# It DISPATCHES rather than committing a VERSION bump and pushing a tag, as it used to: branch
# protection requires a status check that a fresh bot commit cannot have, so the push to main was
# rejected outright ("Required status check ... is expected") -- and a GITHUB_TOKEN-pushed tag cannot
# trigger release.yml either. workflow_dispatch IS GITHUB_TOKEN-triggerable, so it is the one door in.
#
# FORWARD-ONLY still holds (in release.yml): a pin edit pointing at an older or equal upstream builds
# and gates but publishes nothing -- never an auto-published downgrade. Same-upstream repackages are
# repackage-on-ingredient-bump.yml's job (-mavericks.(N+1)).

on:
  push:
    branches: [main]
    paths: ['components/tailscale/version']
  workflow_dispatch:

permissions:
  actions: write        # dispatch release.yml

concurrency:
  group: release-on-bump      # shared with the repackage caller so the auto-cutters never race
  cancel-in-progress: false

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release.yml to consider an upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f upstream_release=true
          echo "dispatched release.yml with upstream_release=true (it decides forward-only)"
