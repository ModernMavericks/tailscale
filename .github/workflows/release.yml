name: release

# Cross-build the three 10.9-compatible Go binaries (tailscaled + tailscale CLI + tailscale-systray)
# and the Sparkle updater on macos-26, assemble + EdDSA-sign the product .pkg, render the signed
# appcast, and attach the .pkg + appcast to a GitHub Release. Every push/PR is validated by ci.yml;
# this workflow publishes from three entry points, and is the ONLY place a version is decided:
#   - a <version>-mavericks.<rev> tag pushed by hand, or
#   - workflow_dispatch upstream_release=true: a NEW upstream, <pinned upstream>-mavericks.1,
#     forward-only. Dispatched by release-on-bump.yml when the tailscale source pin moves.
#   - workflow_dispatch local_release=true: a same-upstream -mavericks.(N+1) REPACKAGE. Dispatched by
#     repackage-on-ingredient-bump.yml when a build ingredient pin moves.
# Both dispatch paths cut and publish INLINE -- the tag is minted by the publish step. Nothing here
# ever commits to main: branch protection requires a status check that a fresh bot commit cannot
# have, so the old commit-VERSION-then-push-a-tag approach could not work (and a GITHUB_TOKEN-pushed
# tag triggers nothing anyway). A plain dispatch builds and gates without publishing.
# All-or-nothing: the single `publish` job is the only writer to Releases and it `needs` package, so
# a build failure never ships a partial release.

on:
  push:
    tags: ['*-mavericks.*']
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut+publish a -mavericks.(N+1) repackage (same upstream, rebuilt with current ingredients)"
        type: boolean
        default: false
      upstream_release:
        description: "Cut+publish <pinned upstream>-mavericks.1 if the tailscale source pin moved forward"
        type: boolean
        default: false

permissions:
  contents: write

# Each tag is a unique ref, so a publish build is never cancelled. Dispatch runs all share
# refs/heads/main, so they get a group per run id -- a repackage must never be cancelled by, or
# cancel, another one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-26
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publish: ${{ steps.ver.outputs.publish }}
      kind: ${{ steps.ver.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # a local_release repackage counts existing <upstream>-mavericks.* tags

      - name: Install mavericks-shared-cmake
        uses: ModernMavericks/shared-cmake/.github/actions/install@v1

      # Decides three things: what VER is, whether this run publishes, and what kind of release it is.
      #
      # THE SHIPPED STATE LIVES IN TAGS, not in the committed VERSION file. Every automated cut
      # publishes with a tag minted at that commit (see the publish job) and never commits VERSION
      # back -- pushing to main is not available to us, since branch protection requires a status
      # check no fresh bot commit can have. So the current upstream/N is read from the tags, seeded
      # from VERSION for the case where no tag exists yet, and each publishing path writes VER into
      # the local VERSION file (not committed) so this job's cmake configure and the updater bundle
      # embed the real version.
      #   - a *-mavericks.* tag: VER = the tag; publish=yes. Committed notes required.
      #   - workflow_dispatch(upstream_release=true): a NEW upstream -- VER = <pinned upstream>-mavericks.1,
      #     forward-only against the newest shipped tag; publish=yes. Dispatched by release-on-bump.yml.
      #   - workflow_dispatch(local_release=true): a REPACKAGE of the shipped upstream --
      #     VER = <that upstream>-mavericks.(N+1); publish=yes. Dispatched by repackage-on-ingredient-bump.yml.
      #   - anything else (plain dispatch): VER = the committed VERSION file; publish=no.
      - name: Decide version + whether this run publishes
        id: ver
        run: |
          CUR=$(cat VERSION)
          CUR_UP="${CUR%%-mavericks.*}"; CUR_N="${CUR##*-mavericks.}"
          case "$CUR_N" in ''|*[!0-9]*) CUR_N=0;; esac
          # Advance to the newest shipped tag (highest upstream, then highest N within it).
          for t in $(git tag --list '*-mavericks.*'); do
            up="${t%%-mavericks.*}"; n="${t##*-mavericks.}"
            case "$n" in ''|*[!0-9]*) continue;; esac
            newest=$(printf '%s\n%s\n' "$CUR_UP" "$up" | sort -V | tail -1)
            if [ "$up" != "$CUR_UP" ] && [ "$newest" = "$up" ]; then
              CUR_UP="$up"; CUR_N="$n"
            elif [ "$up" = "$CUR_UP" ] && [ "$n" -gt "$CUR_N" ]; then
              CUR_N="$n"
            fi
          done
          echo "shipped: ${CUR_UP}-mavericks.${CUR_N}"

          KIND=none
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VER="${GITHUB_REF_NAME}"
            if [ ! -s "release-notes/$VER.md" ]; then
              echo "::error::release-notes/$VER.md missing or empty"; exit 1; fi
            PUBLISH=true; KIND=manual
            printf '%s\n' "$VER" > VERSION
          elif [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${{ inputs.upstream_release }}" = "true" ]; then
            # Read the pin (REPO + REF) and the upstream's own VERSION.txt at that ref -- no clone.
            REPO=$(sed -n 's/^REPO=//p' components/tailscale/version)
            REF=$(sed -n 's/^REF=//p' components/tailscale/version)
            [ -n "$REPO" ] && [ -n "$REF" ] || { echo "::error::malformed components/tailscale/version"; exit 1; }
            slug=$(printf '%s' "$REPO" | sed -E 's#^https?://github.com/##; s#\.git$##')
            UP=$(curl -fsSL "https://raw.githubusercontent.com/$slug/$REF/VERSION.txt" | tr -d '[:space:]')
            case "$UP" in
              [0-9]*.[0-9]*.[0-9]*) : ;;
              *) echo "::error::could not read a sane upstream version from the pinned source (got '$UP')"; exit 1;;
            esac
            # Forward-only: the pin must be strictly ahead of what's shipped, so a pin edit pointing at
            # an older or equal tag is a no-op rather than an auto-published downgrade.
            newest=$(printf '%s\n%s\n' "$CUR_UP" "$UP" | sort -V | tail -1)
            if [ "$UP" = "$CUR_UP" ] || [ "$newest" != "$UP" ]; then
              echo "pin upstream $UP is not ahead of shipped $CUR_UP -- no release (build + gate only)."
              VER="$CUR"; PUBLISH=false
            else
              VER="${UP}-mavericks.1"; PUBLISH=true; KIND=upstream
              printf '%s\n' "$VER" > VERSION
            fi
          elif [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${{ inputs.local_release }}" = "true" ]; then
            VER="${CUR_UP}-mavericks.$((CUR_N + 1))"
            PUBLISH=true; KIND=repackage
            printf '%s\n' "$VER" > VERSION
          else
            VER="$CUR"
            PUBLISH=false
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "version=$VER publish=$PUBLISH kind=$KIND"

      - name: Install patched Go (mavericks-golang cross toolchain)
        run: |
          # Pin lives in components/golang/version (a watchable path -- see ci.yml's copy of this note
          # and repackage-on-ingredient-bump.yml). Verified against golang's published SHA256SUMS.
          ver="$(cat components/golang/version)"
          base="https://github.com/ModernMavericks/golang/releases/download/${ver}"
          curl -fL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          # golang renamed its cross asset prefix go126- -> golang- at 1.26.5-mavericks.1; accept either.
          gover="${ver%%-mavericks.*}"; rev="${ver#*-}"; pkg=""; sum=""
          for pref in golang go126; do
            cand="${pref}-${gover}-cross-${rev}.pkg"
            s=$(awk -v f="$cand" '$2==f' SHA256SUMS || true)
            if [ -n "$s" ]; then pkg="$cand"; sum="$s"; break; fi
          done
          [ -n "$pkg" ] || { echo "::error::no cross pkg for $ver in golang SHA256SUMS"; exit 1; }
          curl -fL --retry 3 -o "$pkg" "$base/$pkg"
          printf '%s\n' "$sum" | shasum -a 256 -c -
          sudo installer -pkg "$pkg" -target /
          echo "/usr/local/go126-cross/bin" >> "$GITHUB_PATH"

      - name: Confirm the patched cross toolchain is on PATH
        run: |
          test "$(command -v go)" = /usr/local/go126-cross/bin/go
          go version

      - name: Cache the MacOSX10.9 SDK
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.sdk-cache
          key: macosx10.9-sdk-v1

      - name: Build + gate the three Go binaries (x86_64 / min-10.9 / no post-10.9 imports)
        env:
          MAVERICKS_SDK_CACHE: ${{ github.workspace }}/.sdk-cache
        run: |
          cmake --preset cross
          cmake --build --preset cross
          ctest --preset cross

      - name: Build the Sparkle updater (must not link tailscale)
        run: |
          cmake -S updater -B build/updater -DCMAKE_OBJC_COMPILER=/usr/bin/clang
          cmake --build build/updater
          BIN=build/updater/TailscaleUpdater.app/Contents/MacOS/TailscaleUpdater
          otool -L "$BIN" | tee /tmp/o.txt
          if otool -L "$BIN" | tail -n +2 | grep -iq tailscale; then
            echo "::error::updater links a tailscale product (self-update circularity)"; exit 1; fi

      # Bundle the packaging inputs into ONE tarball so executable bits (the binaries, the updater .app's
      # Mach-Os) survive the artifact round-trip -- artifacts otherwise drop file modes.
      - name: Stage + upload packaging inputs
        run: |
          export COPYFILE_DISABLE=1
          mkdir -p stage
          cp build-cross/gobin/tailscaled       stage/tailscaled
          cp build-cross/gobin/tailscale        stage/tailscale
          cp build-cross/gobin/tailscale-systray stage/tailscale-systray
          cp -R build/updater/TailscaleUpdater.app stage/TailscaleUpdater.app
          find stage -name '._*' -delete 2>/dev/null || true
          tar -C stage -czf packaging-inputs.tgz .
      - uses: actions/upload-artifact@v7
        with:
          name: packaging-inputs
          path: packaging-inputs.tgz

  # Assemble + sign the product .pkg and render the signed appcast. Runs on macos-26 for
  # pkgbuild/productbuild + the shared signer.
  package:
    if: needs.build-macos.outputs.publish == 'true'
    needs: [build-macos]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install mavericks-shared-cmake
        uses: ModernMavericks/shared-cmake/.github/actions/install@v1
      - uses: actions/download-artifact@v8
        with: { name: packaging-inputs, path: dl }

      # This job's checkout is fresh (a separate runner), so it does NOT see the VERSION mutation
      # build-macos made for a local_release repackage -- use the version build-macos decided. For the
      # same reason a freshly-cut repackage has no committed release-notes/$VER.md; stub it so
      # sign_and_appcast.sh's --notes-file has a non-empty file. (A tag release already validated its
      # notes exist in build-macos, so this only ever fires for a dispatch-cut repackage.)
      - name: Ensure release-notes/$VER.md exists
        env:
          VER: ${{ needs.build-macos.outputs.version }}
          KIND: ${{ needs.build-macos.outputs.kind }}
        run: |
          NOTES="release-notes/$VER.md"
          if [ ! -s "$NOTES" ]; then
            mkdir -p release-notes
            UP="${VER%%-mavericks.*}"
            {
              echo "ModernMavericks Tailscale $VER."
              echo
              if [ "$KIND" = upstream ]; then
                echo "- Tracks upstream Tailscale **$UP**, built with the ModernMavericks go126"
                echo "  toolchain (x86_64, minimum-10.9, compat_guard-gated)."
                echo "- Automatically cut from the tailscale source pin bump."
              else
                echo "- Repackage of upstream Tailscale **$UP**, rebuilt with the current build"
                echo "  ingredients (see components/ for what moved -- typically the ModernMavericks Go"
                echo "  toolchain). No upstream Tailscale change."
                echo "- Automatically cut from a build-ingredient bump."
              fi
            } > "$NOTES"
          fi

      - name: Assemble + sign the .pkg, render the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}   # sign_and_appcast.sh fetches ed25519-sign via `gh`
          VER: ${{ needs.build-macos.outputs.version }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          SH="$(cat "$HOME/.cmake/packages/MavericksSharedCMake/"* | head -1)/scripts"
          [ -d "$SH" ] || { echo "::error::shared-cmake scripts not found at $SH"; exit 1; }
          mkdir -p in dist
          tar -C in -xzf dl/packaging-inputs.tgz          # restores executable bits
          # Wrap the systray binary into the menu-bar .app the package expects.
          sh cmake/make_app.sh in/tailscale-systray in/Tailscale.app "$VER"
          PKG="dist/tailscale-$VER.pkg"

          # dist/ in the repo holds the LaunchDaemon/Agent plists + pre/postinstall scripts.
          MSC_SCRIPTS="$SH" sh cmake/package_pkg.sh --out "$PKG" --version "$VER" \
            --tailscaled in/tailscaled --tailscale in/tailscale \
            --systray-app in/Tailscale.app --updater-app in/TailscaleUpdater.app \
            --daemon-plist "$GITHUB_WORKSPACE/dist/com.tailscale.tailscaled.plist" \
            --systray-agent "$GITHUB_WORKSPACE/dist/com.tailscale.systray.plist" \
            --dist "$GITHUB_WORKSPACE/dist"

          # Verify the 10.9.5 floor on the CI-built .pkg before signing/publishing.
          W=$(mktemp -d); pkgutil --expand "$PKG" "$W/x"
          grep -q '<os-version min="10.9.5"/>' "$W/x/Distribution" \
            || { echo "::error::.pkg is missing the 10.9.5 install floor"; exit 1; }

          # Sign the .pkg + render the signed appcast (auto-fetches the prebuilt ed25519-sign). The
          # enclosure points at the versioned release asset; the client /latest/ feed resolves to this
          # full release immediately, so Sparkle clients pick it up right away.
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$PKG")"
          sh "$SH/sign_and_appcast.sh" \
            --channel-title "Tailscale for Mavericks" \
            --version "$VER" --pkg-url "$URL" --min-os 10.9.5 \
            --notes-file "release-notes/$VER.md" --pkg "$PKG" > dist/appcast.xml
          (cd dist && shasum -a 256 ./*.pkg > SHA256SUMS)
          echo "=== appcast.xml ==="; cat dist/appcast.xml
      - uses: actions/upload-artifact@v7
        with:
          name: tailscale-pkg
          path: |
            dist/*.pkg
            dist/appcast.xml
            dist/SHA256SUMS

  # All-or-nothing publish: the ONLY writer to Releases, gated on package. On a tag push the tag
  # already exists; on a workflow_dispatch local_release there is no tag yet (and a GITHUB_TOKEN-pushed
  # tag wouldn't trigger anything anyway) -- explicit tag_name + target_commitish tell
  # action-gh-release to mint the -mavericks.(N+1) tag at this commit, inline, in the run that
  # publishes it. No second hop, no push.
  publish:
    if: needs.build-macos.outputs.publish == 'true'
    needs: [build-macos, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-macos.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.pkg
            dist/appcast.xml
            dist/SHA256SUMS
